  @media (max-width:600px) { .ph { flex-basis:calc(var(--r) * 110px); } }

  dialog button { position:absolute; background:none; border:0; color:#fff; font:inherit;

  dialog button:hover, dialog button:focus-visible { opacity:1; }

<dialog id="v" aria-label="Photo viewer">
  <img id="vi" alt="">
  <button class="close" aria-label="Close">&times;</button>
  <button class="prev" aria-label="Previous photo">&lsaquo;</button>
  <button class="next" aria-label="Next photo">&rsaquo;</button>
</dialog>
<script>
  const links=[...document.querySelectorAll('.ph')], v=document.getElementById('v'), vi=document.getElementById('vi');
  let i=0;
  const show=k=>{ i=(k+links.length)%links.length; const img=links[i].querySelector('img'); vi.src=links[i].href; vi.alt=img.alt; };
  links.forEach((a,k)=>a.addEventListener('click',e=>{ e.preventDefault(); show(k); v.showModal(); }));
  v.querySelector('.close').onclick=()=>v.close();
  v.querySelector('.prev').onclick=()=>show(i-1);
  v.querySelector('.next').onclick=()=>show(i+1);
  v.addEventListener('click',e=>{ if(e.target===v) v.close(); });
  document.addEventListener('keydown',e=>{ if(!v.open) return;
    if(e.key==='ArrowLeft') show(i-1); if(e.key==='ArrowRight') show(i+1); });
  let x0=null; v.addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
  v.addEventListener('touchend',e=>{ if(x0===null) return; const dx=e.changedTouches[0].clientX-x0;
    if(Math.abs(dx)>40) show(dx<0?i+1:i-1); x0=null; });
</script>
</body>
