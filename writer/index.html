<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>writer</title>
<style>
  :root { --bg:#000000; --ink:#B49FE8; --muted:#8E7DC4; color-scheme:dark; box-sizing:border-box;
          padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  *, *::before, *::after { box-sizing:inherit; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: Georgia, "Times New Roman", serif;
         font-size:1.125rem; line-height:1.6; }
  main { max-width:38rem; margin:0 auto; padding:2.5rem 1.25rem 4rem; }
  a { color:var(--ink); }
  .home { color:var(--muted); text-decoration:none; font-size:.95rem; }
  .home:hover, .home:focus-visible { color:var(--ink); text-decoration:underline; }
  h1 { font-weight:normal; font-size:1.6rem; margin:.4rem 0 1.5rem; }
  h2 { font-weight:bold; font-size:1.125rem; margin:2.5rem 0 .5rem; }
  ul { padding-left:1.2rem; }
  a:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
</style>
</head>
<body>
<main>
<a class="home" href="/">me in 10 seconds</a>
<h1>writer</h1>
<p>I write every day. Mostly for myself and mostly to myself. I don't publish much of it. Maybe someday I will.</p>
</main>
</body>
</html>
