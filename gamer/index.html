<style>
  :root { --bg:#ffffff; --ink:#000000; --muted:#6b6b6b; --gap:6px; box-sizing:border-box;
          padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#000000; --ink:#ffffff; --muted:#9a9a9a; } }
  :root[data-theme="dark"] { --bg:#000000; --ink:#ffffff; --muted:#9a9a9a; }
  *, *::before, *::after { box-sizing:inherit; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family: Georgia, "Times New Roman", serif; }
  header { max-width:1400px; margin:0 auto; padding:2.5rem 1rem 1.5rem; }
  header a { color:var(--muted); text-decoration:none; font-size:.95rem; }
  header a:hover, header a:focus-visible { color:var(--ink); text-decoration:underline; }
  h1 { font-weight:normal; font-size:1.6rem; margin:.4rem 0 0; }
  /* justified rows: each photo keeps its own shape, rows fill the width */
  .grid { max-width:1400px; margin:0 auto; padding:0 1rem 4rem;
          display:flex; flex-wrap:wrap; gap:var(--gap); }
  .grid::after { content:""; flex-grow:999; }
  .ph { flex-grow:calc(var(--r) * 100); flex-basis:calc(var(--r) * 220px); display:block; }
  .ph img { display:block; width:100%; height:auto; aspect-ratio:var(--r); object-fit:cover; background:#ddd; }
  .ph:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
  @media (max-width:600px) { .ph { flex-basis:calc(var(--r) * 110px); } }
  /* viewer */
  dialog { border:0; padding:0; max-width:100vw; max-height:100vh; width:100vw; height:100%;
           background:rgba(0,0,0,.94); }
  dialog::backdrop { background:rgba(0,0,0,.94); }
  dialog img { position:absolute; inset:0; margin:auto; max-width:94vw; max-height:90vh; }
  dialog button { position:absolute; background:none; border:0; color:#fff; font:inherit;
                  font-size:1.6rem; padding:1rem; cursor:pointer; opacity:.7; }
  dialog button:hover, dialog button:focus-visible { opacity:1; }
  .close { top:env(safe-area-inset-top,0px); right:0; }
  .prev { left:0; top:50%; transform:translateY(-50%); }
  .next { right:0; top:50%; transform:translateY(-50%); }
</style>

<dialog id="v" aria-label="Photo viewer">
  <img id="vi" alt="">
  <button class="close" aria-label="Close">&times;</button>
  <button class="prev" aria-label="Previous photo">&lsaquo;</button>
  <button class="next" aria-label="Next photo">&rsaquo;</button>
</dialog>
<script>
  const links=[...document.querySelectorAll('.ph')], v=document.getElementById('v'), vi=document.getElementById('vi');
  let i=0;
  const show=k=>{ i=(k+links.length)%links.length; const img=links[i].querySelector('img'); vi.src=links[i].href; vi.alt=img.alt; };
  links.forEach((a,k)=>a.addEventListener('click',e=>{ e.preventDefault(); show(k); v.showModal(); }));
  v.querySelector('.close').onclick=()=>v.close();
  v.querySelector('.prev').onclick=()=>show(i-1);
  v.querySelector('.next').onclick=()=>show(i+1);
  v.addEventListener('click',e=>{ if(e.target===v) v.close(); });
  document.addEventListener('keydown',e=>{ if(!v.open) return;
    if(e.key==='ArrowLeft') show(i-1); if(e.key==='ArrowRight') show(i+1); });
  let x0=null; v.addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
  v.addEventListener('touchend',e=>{ if(x0===null) return; const dx=e.changedTouches[0].clientX-x0;
    if(Math.abs(dx)>40) show(dx<0?i+1:i-1); x0=null; });
</script>
