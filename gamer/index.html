  :root { --bg:#ffffff; --ink:#000000; --muted:#6b6b6b; --gap:6px; box-sizing:border-box;
          padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#000000; --ink:#ffffff; --muted:#9a9a9a; } }
  :root[data-theme="dark"] { --bg:#000000; --ink:#ffffff; --muted:#9a9a9a; }
  *, *::before, *::after { box-sizing:inherit; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family: Georgia, "Times New Roman", serif; }
  header { max-width:1400px; margin:0 auto; padding:2.5rem 1rem 1.5rem; }
  header a { color:var(--muted); text-decoration:none; font-size:.95rem; }
  header a:hover, header a:focus-visible { color:var(--ink); text-decoration:underline; }
  h1 { font-weight:normal; font-size:1.6rem; margin:.4rem 0 0; }
  /* every poster the same size */
  .grid { max-width:1400px; margin:0 auto; padding:0 1rem 4rem;
          display:grid; grid-template-columns:repeat(auto-fill, 110px); gap:var(--gap); }
  .grid img { display:block; width:110px; height:165px; object-fit:cover; background:#ddd; }
</style>
